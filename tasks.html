<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Daily Count — 242 Plug</title>
<meta name="theme-color" content="#0E1014"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap">
<style>
:root{
  --ink:#0E1014; --surface:#171A21; --surface2:#1E222B; --line:#2A2F3A;
  --text:#F3F4F8; --muted:#98A0B2;
  --accent:#C8FF2E; --good:#3ADE7E; --warn:#FFA41B; --bad:#FF5470;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.4;
  -webkit-text-size-adjust:100%;
  padding-bottom:110px;
}
h1,h2,.display{font-family:"Anton",Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.5px;text-transform:uppercase;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}

/* ── header ─────────────────────────────── */
header{
  position:sticky; top:0; z-index:50;
  background:rgba(14,16,20,.96); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding-block:12px 10px;
}
.topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:23px;line-height:1}
h1 span{color:var(--accent)}
.date{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.who{
  margin-left:auto;background:var(--surface2);border:1px solid var(--line);
  color:var(--text);border-radius:999px;padding:7px 12px;font:600 13px Archivo,sans-serif;
  min-width:120px;
}
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:11px;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.stats{display:flex;gap:14px;margin-top:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
.stats .miss b{color:var(--warn)}

.tools{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
#q{
  flex:1 1 180px;min-width:0;background:var(--surface2);border:1px solid var(--line);
  color:var(--text);border-radius:999px;padding:10px 15px;font:400 15px Archivo,sans-serif;
}
#q::placeholder{color:var(--muted)}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.filt{
  flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:8px 13px;font:600 12.5px Archivo,sans-serif;
  text-transform:uppercase;letter-spacing:.4px;cursor:pointer;
}
.filt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#11140A}

/* ── list ───────────────────────────────── */
.list{display:grid;gap:12px;margin-top:16px;grid-template-columns:1fr}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
@media(min-width:1040px){.list{grid-template-columns:1fr 1fr 1fr}}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;
}
.card.done{border-color:var(--good)}
.card.short{border-color:var(--warn)}
.head{display:flex;gap:12px;padding:12px}
.shot{
  flex:0 0 86px;width:86px;height:86px;border-radius:10px;background:var(--surface2);
  object-fit:cover;border:1px solid var(--line);
}
.shot.blank{display:flex;align-items:center;justify-content:center;font-size:30px;color:#3A4150}
.meta{min-width:0;flex:1}
.nick{font-family:"Anton",Impact,sans-serif;font-size:17px;line-height:1.1;text-transform:uppercase}
.nm{font-size:13.5px;color:var(--text);margin-top:2px}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.sub em{font-style:normal;color:var(--accent)}
.tally{
  margin-top:6px;font:700 13px Archivo,sans-serif;font-variant-numeric:tabular-nums;
  color:var(--muted);
}
.tally b{color:var(--text)}
.card.done .tally b{color:var(--good)}
.card.short .tally b{color:var(--warn)}

.sizes{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.sz{
  min-width:46px;min-height:40px;padding:6px 8px;border-radius:9px;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  font:700 14px Archivo,sans-serif;font-variant-numeric:tabular-nums;cursor:pointer;
  transition:transform .08s ease;
}
.sz:active{transform:scale(.94)}
.sz[data-st="here"]{background:var(--good);border-color:var(--good);color:#06240F}
.sz[data-st="gone"]{background:transparent;border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.acts{display:flex;gap:8px;padding:0 12px 12px;margin-top:auto}
.acts button{
  flex:1;border-radius:10px;padding:10px;cursor:pointer;
  font:700 12.5px Archivo,sans-serif;text-transform:uppercase;letter-spacing:.5px;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
}
.acts .all{background:var(--good);border-color:var(--good);color:#06240F}
.acts .clr{color:var(--muted)}

.empty{padding:50px 10px;text-align:center;color:var(--muted)}

/* ── send bar ───────────────────────────── */
.send{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(14,16,20,.97);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
}
.send .inner{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center}
.send .txt{font-size:12px;color:var(--muted);flex:1;min-width:0}
.send .txt b{color:var(--text)}
.send button{
  background:var(--accent);border:none;color:#11140A;border-radius:11px;
  padding:13px 20px;font:700 14px Archivo,sans-serif;text-transform:uppercase;
  letter-spacing:.6px;cursor:pointer;
}
.send button[disabled]{opacity:.45}
.toast{
  position:fixed;left:16px;right:16px;bottom:96px;z-index:70;
  background:var(--good);color:#06240F;border-radius:11px;padding:13px 15px;
  font:700 14px Archivo,sans-serif;text-align:center;
  transform:translateY(160%);transition:transform .25s ease;
}
.toast.show{transform:translateY(0)}
.toast.bad{background:var(--bad);color:#2A0710}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="topline">
      <h1>Daily <span>Count</span></h1>
      <div class="date" id="today"></div>
      <select class="who" id="who" aria-label="Who is counting">
        <option>Deashinique</option>
        <option>Manager</option>
        <option>Owner</option>
      </select>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="stats">
      <span>Shoes <b id="s-shoes">0/0</b></span>
      <span>Pairs found <b id="s-pairs">0/0</b></span>
      <span class="miss">Missing <b id="s-miss">0</b></span>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search shoe, colour or code…" autocomplete="off"/>
    </div>
    <div class="tools chipbar">
      <button class="filt" data-f="todo" aria-pressed="true">To count</button>
      <button class="filt" data-f="short" aria-pressed="false">Missing</button>
      <button class="filt" data-f="done" aria-pressed="false">Counted</button>
      <button class="filt" data-f="all" aria-pressed="false">All</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden></div>
</main>

<div class="send">
  <div class="inner">
    <div class="txt" id="sendtxt">Loading…</div>
    <button id="sendbtn" disabled>Send count</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="tasks-data.js"></script>
<script>
(function(){
'use strict';
var API='https://sneakerplug242-api-production.up.railway.app';
var KEY='sp242-shop-c988c5711bf067dccccc85b55fc14fde';

var TODAY=new Date().toISOString().slice(0,10);
var STORE='sp_count_'+TODAY;
var shoes=(window.SP_SHOES||[]).slice();
var marks=load();
var filter='todo', query='';

function load(){ try{ return JSON.parse(localStorage.getItem(STORE)||'{}'); }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(marks)); }catch(e){} }

document.getElementById('today').textContent=
  new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});

var whoSel=document.getElementById('who');
try{ var w=localStorage.getItem('sp_count_who'); if(w) whoSel.value=w; }catch(e){}
whoSel.onchange=function(){ try{ localStorage.setItem('sp_count_who',whoSel.value); }catch(e){} };

/* ── live sizes from the shop, so the sheet matches the app ── */
function refresh(){
  fetch(API+'/shop/state?key='+KEY,{cache:'no-store'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(st){
      if(!st||!st.shoes) return;
      var gone={}; (st.deleted||[]).forEach(function(id){ gone[id]=1; });
      var live={}; st.shoes.forEach(function(s){ if(s&&s.id) live[s.id]=s; });
      shoes=shoes.filter(function(s){ return !gone[s.id]; });
      shoes.forEach(function(s){
        var l=live[s.id];
        if(l&&l.sizes&&l.sizes.length) s.s=l.sizes;
        if(l&&l.price) s.p=l.price;
      });
      render();
    })
    .catch(function(){ /* offline: the baked list still works */ });
}

/* ── counting state ── */
function st(id,i){ var m=marks[id]; return (m&&m[i])||''; }
function set(id,i,v){
  if(!marks[id]) marks[id]={};
  if(v) marks[id][i]=v; else delete marks[id][i];
  if(!Object.keys(marks[id]).length) delete marks[id];
  save();
}
function tallyOf(s){
  var here=0,gone=0,n=s.s.length;
  for(var i=0;i<n;i++){ var v=st(s.id,i); if(v==='here')here++; else if(v==='gone')gone++; }
  return {here:here,gone:gone,total:n,touched:here+gone,done:(here+gone)===n&&n>0};
}

function totals(){
  var t={shoes:0,shoesDone:0,pairs:0,here:0,miss:0};
  shoes.forEach(function(s){
    var q=tallyOf(s);
    t.shoes++; t.pairs+=q.total; t.here+=q.here; t.miss+=q.gone;
    if(q.done)t.shoesDone++;
  });
  return t;
}

function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function matches(s){
  if(query){
    var hay=(s.b+' '+s.n+' '+(s.k||'')+' '+(s.c||'')+' '+s.id).toLowerCase();
    if(hay.indexOf(query)<0) return false;
  }
  var q=tallyOf(s);
  if(filter==='todo') return !q.done;
  if(filter==='done') return q.done;
  if(filter==='short') return q.gone>0;
  return true;
}

var listEl=document.getElementById('list'), emptyEl=document.getElementById('empty');

function render(){
  var rows=shoes.filter(matches);
  listEl.innerHTML=rows.map(cardHTML).join('');
  emptyEl.hidden=rows.length>0;
  if(!rows.length){
    emptyEl.textContent = filter==='todo'
      ? (query?'Nothing left to count matching that.':'Every shoe is counted. Send it in 👇')
      : 'Nothing here yet.';
  }
  var t=totals();
  document.getElementById('s-shoes').textContent=t.shoesDone+'/'+t.shoes;
  document.getElementById('s-pairs').textContent=t.here+'/'+t.pairs;
  document.getElementById('s-miss').textContent=t.miss;
  document.getElementById('barfill').style.width=(t.shoes?(t.shoesDone/t.shoes*100):0)+'%';
  var btn=document.getElementById('sendbtn');
  btn.disabled = t.shoesDone===0;
  document.getElementById('sendtxt').innerHTML = t.shoesDone===0
    ? 'Tap every size you can find. It saves as you go.'
    : '<b>'+t.shoesDone+'</b> shoes counted · <b>'+t.here+'</b> pairs found'+(t.miss?' · <b>'+t.miss+'</b> missing':'');
}

function cardHTML(s){
  var q=tallyOf(s);
  var cls='card'+(q.done?(q.gone?' short':' done'):(q.gone?' short':''));
  var title=s.k?esc(s.k):esc(s.n);
  var shot=s.i
    ? '<img class="shot" loading="lazy" src="'+esc(s.i)+'" alt="'+esc(s.n)+'" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'shot blank\',textContent:\'👟\'}))"/>'
    : '<div class="shot blank">👟</div>';
  var chips=s.s.map(function(sz,i){
    var v=st(s.id,i);
    return '<button class="sz" data-id="'+esc(s.id)+'" data-i="'+i+'"'+(v?' data-st="'+v+'"':'')+
           ' aria-label="Size '+esc(sz)+'">'+esc(sz)+'</button>';
  }).join('');
  return '<article class="'+cls+'" id="c-'+esc(s.id)+'">'+
    '<div class="head">'+shot+
      '<div class="meta">'+
        '<div class="nick">'+title+'</div>'+
        (s.k?'<div class="nm">'+esc(s.n)+'</div>':'')+
        '<div class="sub">'+esc(s.c||'')+' · <em>$'+esc(s.p||'')+'</em> · '+esc(s.id)+'</div>'+
        '<div class="tally"><b>'+q.here+'</b> of <b>'+q.total+'</b> pairs found'+
          (q.gone?' · <b>'+q.gone+' missing</b>':'')+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="sizes">'+chips+'</div>'+
    '<div class="acts">'+
      '<button class="all" data-all="'+esc(s.id)+'">All here</button>'+
      '<button class="clr" data-clr="'+esc(s.id)+'">Clear</button>'+
    '</div>'+
  '</article>';
}

/* one tap = found, two taps = missing, three = back to blank */
var NEXT={'':'here','here':'gone','gone':''};

document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;

  if(b.classList.contains('sz')){
    var id=b.dataset.id, i=+b.dataset.i;
    var v=NEXT[st(id,i)]; set(id,i,v);
    if(v) b.dataset.st=v; else delete b.dataset.st;
    repaint(id); return;
  }
  if(b.dataset.all){
    var s=byId(b.dataset.all);
    marks[s.id]={}; s.s.forEach(function(_,i){ marks[s.id][i]='here'; }); save();
    render(); return;
  }
  if(b.dataset.clr){ delete marks[b.dataset.clr]; save(); render(); return; }
  if(b.classList.contains('filt')){
    filter=b.dataset.f;
    [].forEach.call(document.querySelectorAll('.filt'),function(x){
      x.setAttribute('aria-pressed', x===b?'true':'false'); });
    render(); window.scrollTo({top:0,behavior:'smooth'}); return;
  }
});

function byId(id){ for(var i=0;i<shoes.length;i++) if(shoes[i].id===id) return shoes[i]; }

/* update just this card's numbers and edge colour — keeps her place on the page */
function repaint(id){
  var s=byId(id), q=tallyOf(s), el=document.getElementById('c-'+id);
  if(!el) return;
  el.className='card'+(q.done?(q.gone?' short':' done'):(q.gone?' short':''));
  el.querySelector('.tally').innerHTML='<b>'+q.here+'</b> of <b>'+q.total+'</b> pairs found'+
    (q.gone?' · <b>'+q.gone+' missing</b>':'');
  var t=totals();
  document.getElementById('s-shoes').textContent=t.shoesDone+'/'+t.shoes;
  document.getElementById('s-pairs').textContent=t.here+'/'+t.pairs;
  document.getElementById('s-miss').textContent=t.miss;
  document.getElementById('barfill').style.width=(t.shoes?(t.shoesDone/t.shoes*100):0)+'%';
  var btn=document.getElementById('sendbtn'); btn.disabled=t.shoesDone===0;
  document.getElementById('sendtxt').innerHTML='<b>'+t.shoesDone+'</b> shoes counted · <b>'+
    t.here+'</b> pairs found'+(t.miss?' · <b>'+t.miss+'</b> missing':'');
}

var qEl=document.getElementById('q'), qT;
qEl.oninput=function(){ clearTimeout(qT); qT=setTimeout(function(){
  query=qEl.value.trim().toLowerCase(); render(); },180); };

/* ── send ── */
function toast(msg,bad){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(bad?' bad':'');
  setTimeout(function(){ t.className='toast'+(bad?' bad':''); },4000);
}

document.getElementById('sendbtn').onclick=function(){
  var btn=this; var who=whoSel.value;
  var t=totals(), lines=[];
  shoes.forEach(function(s){
    var q=tallyOf(s); if(!q.gone) return;
    var missing=s.s.filter(function(_,i){ return st(s.id,i)==='gone'; });
    lines.push('• '+(s.k||s.n)+' ('+s.id+') — '+q.gone+' missing: '+missing.join(', '));
  });
  var text='📋 COUNT '+TODAY+' — '+who+'\n'+
    t.shoesDone+' of '+t.shoes+' shoes counted · '+t.here+' of '+t.pairs+' pairs found';
  if(lines.length){
    text+='\n\nNOT FOUND ('+t.miss+' pairs):\n'+lines.slice(0,40).join('\n');
    if(lines.length>40) text+='\n…and '+(lines.length-40)+' more shoes short.';
  } else if(t.shoesDone){
    text+='\n\nEverything counted was on the shelf. ✅';
  }
  btn.disabled=true; btn.textContent='Sending…';
  fetch(API+'/shop/note?key='+KEY,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text:text, kind:'task', by:who})
  })
  .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
  .then(function(){ toast('Sent to the shop ✅'); })
  .catch(function(){ toast('Could not send — check your internet, your count is saved', true); })
  .then(function(){ btn.disabled=false; btn.textContent='Send count'; });
};

render();
refresh();
})();
</script>
</body>
</html>
