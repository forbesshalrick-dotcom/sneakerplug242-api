<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>242PLUG — Wholesale</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080808;--s1:#111;--s2:#1a1a1a;--border:#222;--acc:#c8f135;--acc2:rgba(200,241,53,.12);--txt:#f0f0f0;--dim:#888;--muted:#555;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;min-height:100vh;}
button,input{font-family:'Inter',sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}

/* ---- LOCK SCREEN ---- */
#lock{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;}
#lock.hidden{display:none;}
.lock-logo{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:4px;color:var(--acc);line-height:1;text-align:center;}
.lock-sub{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--dim);margin-top:6px;margin-bottom:48px;text-align:center;}
.lock-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
#lockInput{background:var(--s1);border:1px solid var(--border);color:var(--txt);font-size:20px;font-family:'Space Mono',monospace;letter-spacing:4px;text-align:center;padding:14px 24px;border-radius:10px;width:260px;outline:none;transition:border-color .2s,box-shadow .2s;}
#lockInput:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2);}
#lockInput.shake{animation:shake .35s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
#lockErr{color:#ff4455;font-size:12px;margin-top:10px;min-height:16px;text-align:center;}
#lockBtn{margin-top:20px;width:260px;padding:14px;background:var(--acc);color:#000;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:none;border-radius:10px;cursor:pointer;transition:opacity .2s;}
#lockBtn:hover{opacity:.88;}

/* ---- MAIN ---- */
#main{display:none;}
#main.show{display:block;}

/* ---- NAV ---- */
nav{background:var(--s1);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:100;}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:var(--txt);line-height:1;}
.nav-logo span{color:var(--acc);}
.nav-badge{font-size:10px;letter-spacing:2px;text-transform:uppercase;background:var(--acc2);color:var(--acc);border:1px solid rgba(200,241,53,.3);border-radius:20px;padding:3px 10px;font-weight:600;}
#navCount{margin-left:auto;font-size:12px;color:var(--dim);}

/* ---- FILTER BAR ---- */
.filter-bar{padding:14px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:56px;z-index:99;}
#searchInput{background:var(--s1);border:1px solid var(--border);color:var(--txt);padding:8px 14px;border-radius:8px;font-size:13px;outline:none;transition:border-color .2s;width:200px;}
#searchInput:focus{border-color:var(--acc);}
#searchInput::placeholder{color:var(--muted);}
.brand-tabs{display:flex;gap:5px;flex-wrap:wrap;}
.btab{background:none;border:1px solid var(--border);color:var(--dim);padding:6px 13px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btab:hover{border-color:var(--acc);color:var(--acc);}
.btab.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700;}

/* ---- GRID ---- */
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 14px 80px;}
@media(min-width:520px){#grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:800px){#grid{grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px 80px;}}
@media(min-width:1100px){#grid{grid-template-columns:repeat(5,1fr);}}

/* ---- TILE ---- */
.tile{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s;display:flex;flex-direction:column;}
.tile:hover{border-color:rgba(200,241,53,.4);}
.tile-img-wrap{width:100%;aspect-ratio:4/3;overflow:hidden;background:#000;position:relative;}
.tile-img{width:100%;height:100%;object-fit:cover;display:block;}
.tile-no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;}
.tile-body{padding:10px 10px 12px;display:flex;flex-direction:column;flex:1;gap:3px;}
.tile-brand{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);font-weight:700;}
.tile-name{font-size:12px;font-weight:600;line-height:1.35;color:var(--txt);}
.tile-color{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tile-price{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--acc);margin-top:4px;}
.tile-sizes{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px;}
.sz{font-size:9px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;color:var(--dim);}

/* ---- LOADING / EMPTY ---- */
#loading{text-align:center;padding:80px 20px;color:var(--dim);}
#loading .spin{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
#empty{display:none;text-align:center;padding:80px 20px;color:var(--dim);}
#empty h3{font-size:18px;margin-bottom:8px;color:var(--txt);}

/* ---- FOOTER ---- */
footer{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;z-index:100;}
footer p{font-size:12px;color:var(--dim);flex:1;}
#waBtn{background:var(--acc);color:#000;font-weight:700;font-size:13px;letter-spacing:.5px;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;white-space:nowrap;transition:opacity .2s;}
#waBtn:hover{opacity:.85;}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="lock-logo">242PLUG</div>
  <div class="lock-sub">Wholesale Access</div>
  <div class="lock-label">Enter your access code</div>
  <input id="lockInput" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="——————"/>
  <div id="lockErr"></div>
  <button id="lockBtn">UNLOCK</button>
</div>

<!-- MAIN CATALOG -->
<div id="main">
  <nav>
    <div class="nav-logo">242<span>PLUG</span></div>
    <div class="nav-badge">Wholesale</div>
    <span id="navCount"></span>
  </nav>

  <div class="filter-bar">
    <input id="searchInput" type="search" placeholder="Search shoes…"/>
    <div class="brand-tabs" id="brandTabs"></div>
  </div>

  <div id="loading"><div class="spin"></div>Loading catalog…</div>
  <div id="grid" style="display:none"></div>
  <div id="empty"><h3>No shoes match</h3><p>Try a different search or brand.</p></div>

  <footer>
    <p>Wholesale enquiries — WhatsApp us to place an order</p>
    <button id="waBtn" onclick="openWA()">WhatsApp Us</button>
  </footer>
</div>

<script>
(function(){
  var CODE   = '__WHOLESALE_CODE__';
  var WA_NUM = '__WA_NUM__';
  var API    = 'https://sneakerinventory.com/api/catalog';
  var SK     = 'ws_unlocked';

  function openWA(){
    window.open('https://wa.me/' + WA_NUM + '?text=' + encodeURIComponent("Hi, I'd like to enquire about wholesale prices 👟"), '_blank');
  }
  window.openWA = openWA;

  // ---- LOCK ----
  var inp  = document.getElementById('lockInput');
  var err  = document.getElementById('lockErr');
  var lock = document.getElementById('lock');
  var main = document.getElementById('main');

  function unlock(){
    lock.classList.add('hidden');
    main.classList.add('show');
    loadCatalog();
  }

  if (sessionStorage.getItem(SK) === CODE) {
    unlock();
  } else {
    document.getElementById('lockBtn').addEventListener('click', tryUnlock);
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
  }

  function tryUnlock(){
    var v = inp.value.trim();
    if (v.toUpperCase() === CODE.toUpperCase()) {
      sessionStorage.setItem(SK, CODE);
      unlock();
    } else {
      err.textContent = 'Wrong code — try again';
      inp.classList.add('shake');
      setTimeout(function(){ inp.classList.remove('shake'); }, 400);
      inp.select();
    }
  }

  // ---- CATALOG ----
  var allProducts = [];
  var allBrands   = [];
  var activeBrand = 'All';
  var searchQ     = '';
  var searchTimer = null;

  function loadCatalog(){
    fetch(API)
      .then(function(r){ return r.json(); })
      .then(function(data){
        allProducts = data.products || [];
        allBrands   = data.brands   || [];
        document.getElementById('loading').style.display = 'none';
        document.getElementById('grid').style.display    = '';
        buildTabs();
        render();
      })
      .catch(function(e){
        document.getElementById('loading').innerHTML = '<p style="color:#ff4455">Could not load catalog — please refresh</p>';
      });
  }

  function buildTabs(){
    var tabs = document.getElementById('brandTabs');
    (['All'].concat(allBrands)).forEach(function(b){
      var btn = document.createElement('button');
      btn.className = 'btab' + (b==='All'?' on':'');
      btn.textContent = b;
      btn.addEventListener('click', function(){
        activeBrand = b;
        document.querySelectorAll('.btab').forEach(function(t){ t.classList.remove('on'); });
        btn.classList.add('on');
        // For brand switch: refetch from API with brand filter (faster on big catalogs)
        if (b === 'All') {
          render();
        } else {
          fetchBrand(b);
        }
      });
      tabs.appendChild(btn);
    });

    document.getElementById('searchInput').addEventListener('input', function(e){
      searchQ = e.target.value.toLowerCase();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(render, 180);
    });
  }

  function fetchBrand(brand){
    document.getElementById('loading').style.display = '';
    document.getElementById('grid').style.display    = 'none';
    fetch(API + '?brand=' + encodeURIComponent(brand))
      .then(function(r){ return r.json(); })
      .then(function(data){
        allProducts = data.products || [];
        document.getElementById('loading').style.display = 'none';
        document.getElementById('grid').style.display    = '';
        render();
      })
      .catch(function(){
        document.getElementById('loading').style.display = 'none';
        document.getElementById('grid').style.display    = '';
      });
  }

  function render(){
    var q = searchQ;
    var list = allProducts.filter(function(s){
      if (!q) return true;
      var hay = ((s.name||'') + ' ' + (s.brand||'') + ' ' + (s.colorway||'') + ' ' + (s.model||'')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });

    document.getElementById('navCount').textContent = list.length + ' styles';
    var grid  = document.getElementById('grid');
    var empty = document.getElementById('empty');

    if (!list.length){
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = list.map(function(s){
      var sizes = (s.sizes || []).slice(0, 10);
      var extra = (s.sizes || []).length - 10;
      var szHtml = sizes.map(function(sz){ return '<span class="sz">'+sz+'</span>'; }).join('');
      if (extra > 0) szHtml += '<span class="sz">+'+extra+'</span>';
      var imgHtml = s.image
        ? '<img class="tile-img" src="'+s.image+'" loading="lazy" alt="'+(s.name||'')+'" onerror="this.parentNode.innerHTML=\'<div class=tile-no-img>👟</div>\'">'
        : '<div class="tile-no-img">👟</div>';
      return '<div class="tile">'
        + '<div class="tile-img-wrap">'+imgHtml+'</div>'
        + '<div class="tile-body">'
        + '<div class="tile-brand">'+(s.brand||'')+'</div>'
        + '<div class="tile-name">'+(s.name||'')+'</div>'
        + (s.colorway ? '<div class="tile-color">'+s.colorway+'</div>' : '')
        + (s.price ? '<div class="tile-price">$'+s.price+'</div>' : '')
        + (szHtml ? '<div class="tile-sizes">'+szHtml+'</div>' : '')
        + '</div></div>';
    }).join('');
  }
})();
</script>
</body>
</html>
